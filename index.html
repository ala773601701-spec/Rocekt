<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocekt Mining</title>
    <script src="https://telegram.org"></script>
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --bg-main: #090714;
            --card-bg: #131026;
            --border-color: rgba(139, 92, 246, 0.25);
            --text-gray: #94a3b8;
        }
        html, body {
            background-color: var(--bg-main);
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }
        .app-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px 20px 14px;
        }
        /* TOP HEADER */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .profile-pill {
            background: #16122b;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .avatar-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
        }
        .icon-pill {
            background: #16122b;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6px 10px;
            font-size: 12px;
            color: #e2e8f0;
            cursor: pointer;
        }
        .section { display: none; }
        .section.active { display: block; }

        .cosmic-card {
            background: linear-gradient(135deg, rgba(46, 16, 101, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%),
                        radial-gradient(circle at top right, #7c3aed, #0f172a);
            border: 1px solid rgba(168, 85, 247, 0.45);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 25px rgba(109, 40, 217, 0.25);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .btn-purple {
            background: linear-gradient(90deg, #7c3aed, #9333ea);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-dark {
            background: #1a1633;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 11px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
            font-size: 13px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        .input-box {
            background: #0d0a1a;
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }
        .input-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            width: 55%;
            text-align: left;
            outline: none;
        }
        .max-btn {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .sub-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: #131026;
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }
        .sub-tab {
            text-align: center;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-gray);
            border-radius: 10px;
            cursor: pointer;
        }
        .sub-tab.active { background: linear-gradient(90deg, #7c3aed, #9333ea); color: #fff; }
        .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
        .slot-box {
            background: #0d0a1c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
        }
        .slot-box.highlight { border: 1px dashed #a855f7; background: rgba(168, 85, 247, 0.08); }

        /* GUARANTEED VISIBLE BOTTOM NAV */
        .bottom-nav {
            background: #110d24;
            border-top: 1px solid rgba(168, 85, 247, 0.3);
            display: flex;
            justify-content: space-around;
            padding: 10px 2px 14px 2px;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active { color: #c084fc; font-weight: bold; }
        .nav-icon { font-size: 18px; margin-bottom: 3px; }
    </style>
</head>
<body>

<div class="app-scroll">
    <!-- TOP HEADER -->
    <div class="top-header">
        <div class="header-right">
            <div class="profile-pill">
                <div class="avatar-circle" id="user-initial">R</div>
                <div>
                    <div style="font-size: 12px; font-weight: bold;" id="user-name">الملف الشخصي</div>
                    <div style="font-size: 10px; color: var(--text-gray);" data-t="ambassador">مستوى السفير 1</div>
                </div>
            </div>
            <div class="icon-pill" onclick="alert('🔔 لا توجد إشعارات جديدة')">🔔</div>
            <div class="icon-pill" id="lang-btn" onclick="toggleLanguage()">▾ AR</div>
        </div>
        <div style="font-weight: 900; font-size: 18px; color: #c084fc;">Rocekt 🚀</div>
    </div>

    <!-- 1. HOME -->
    <div id="tab-home" class="section active">
        <div class="card" style="text-align: center;">
            <div style="color: var(--text-gray); font-size: 13px;" data-t="total_bal">الرصيد المعدّن</div>
            <div style="font-size: 32px; font-weight: 900; margin: 6px 0; direction: ltr;">
                <span id="home-bal">0.0000</span> <span style="font-size: 15px; color: #a855f7;">RCKT</span>
            </div>
        </div>

        <div class="cosmic-card" style="text-align: center;">
            <div style="color: #4ade80; font-size: 13px; font-weight: bold;">● التعدين يعمل الآن (1.00x)</div>
            <div style="font-size: 36px; font-weight: 900; color: #38bdf8; margin: 10px 0; direction: ltr;">+<span id="live-mined">0.0000</span></div>
            <div style="color: #cbd5e1; font-size: 12px; margin-bottom: 12px;"><span data-t="speed">السرعة</span>: <span id="home-speed">25.0</span> RCKT/h</div>
            <button class="btn-purple" onclick="claimAll()" data-t="claim_btn">⚡ استلم RCKT</button>
        </div>

        <div class="grid-3">
            <div class="card" style="text-align: center; padding: 10px 4px;">
                <div style="font-weight: bold; font-size: 15px;" id="stat-hr">25.0</div>
                <div style="font-size: 11px; color: var(--text-gray);" data-t="per_hour">في الساعة</div>
            </div>
            <div class="card" style="text-align: center; padding: 10px 4px;">
                <div style="font-weight: bold; font-size: 15px;" id="stat-day">~600</div>
                <div style="font-size: 11px; color: var(--text-gray);" data-t="daily">يومياً</div>
            </div>
            <div class="card" style="text-align: center; padding: 10px 4px;">
                <div style="font-weight: bold; font-size: 15px; color: #fbbf24;" data-t="bronze">البرونزي</div>
                <div style="font-size: 11px; color: var(--text-gray);">Lv.<span id="stat-lv">1</span></div>
            </div>
        </div>
    </div>

    <!-- 2. MINING -->
    <div id="tab-mining" class="section">
        <div style="font-size: 20px; font-weight: 800; margin-bottom: 10px;" data-t="mining_title">التعدين والترقية</div>
        <div class="cosmic-card">
            <div class="row-between">
                <span style="font-weight: bold; font-size: 16px;">⚡ مفاعل الطاقة Lv.<span id="m-lv">1</span></span>
                <span style="color: #38bdf8; font-weight: bold; direction: ltr;"><span id="m-spd">25</span> RCKT/h</span>
            </div>
